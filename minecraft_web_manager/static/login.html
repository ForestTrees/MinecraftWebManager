<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__MWM_PANEL_TITLE__</title>
    <meta name="mwm-panel-title" content="__MWM_PANEL_TITLE__" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=52" />
    <link rel="stylesheet" href="/assets/style.css?v=52" />
    <script src="/assets/theme.js?v=52"></script>
    <script src="/assets/i18n.js?v=52"></script>
  </head>
  <body>
    <main class="login-shell">
      <div class="login-topright">
        <div class="lang-toggle" role="group" data-i18n-aria="lang_label" aria-label="语言">
          <button type="button" data-lang-option="zh" title="中文">中文</button>
          <button type="button" data-lang-option="en" title="English">EN</button>
        </div>
        <div class="theme-toggle" role="group" data-i18n-aria="theme_label" aria-label="配色模式">
          <button type="button" data-theme-option="light" data-i18n-title="theme_light" title="浅色" aria-label="浅色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button type="button" data-theme-option="dark" data-i18n-title="theme_dark" title="暗黑" aria-label="暗黑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
          <button type="button" data-theme-option="system" data-i18n-title="theme_system" title="跟随系统" aria-label="跟随系统"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
        </div>
      </div>

      <form id="login-form" class="login-card">
        <div class="brand">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg></span>
        </div>
        <h1>__MWM_PANEL_TITLE__</h1>
        <p class="lead" data-i18n="login_lead">使用 MCDR 控制台首次启动时输出的管理员密码登录。</p>
        <div class="login-form">
          <label for="username" data-i18n="username">用户名</label>
          <input id="username" class="field" value="admin" autocomplete="username" required />
          <label for="password" data-i18n="password">密码</label>
          <input id="password" class="field" type="password" autocomplete="current-password" required />
          <p id="login-error" class="error" hidden></p>
          <button type="submit" class="btn" data-i18n="login">登录</button>
        </div>
      </form>
    </main>
    <script src="/assets/login.js?v=52"></script>
  </body>
</html>
